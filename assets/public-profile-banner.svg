<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">PandaLogica: Your data. The answers you need. MBI delivers today.</title>
  <desc id="description">A blue business intelligence chart against a dark background.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
